pipeline:
  name: shantelleGit
  identifier: shantelleGit
  projectIdentifier: Shantelle_Project
  orgIdentifier: UX_Team
  tags: {}
  stages:
    - parallel:
        - stage:
            name: Custo
            identifier: Custo
            description: ""
            type: Custom
            spec:
              execution:
                steps:
                  - step:
                      type: HarnessApproval
                      name: HarnessApproval_1
                      identifier: HarnessApproval_1
                      spec:
                        approvalMessage: Please reviews the following information and approve the pipeline progression
                        includePipelineExecutionHistory: true
                        isAutoRejectEnabled: false
                        approvers:
                          userGroups:
                            - _project_all_users
                          minimumCount: 1
                          disallowPipelineExecutor: false
                        approverInputs: []
                      timeout: 1d
                  - step:
                      type: ShellScript
                      name: ShellScript_1
                      identifier: ShellScript_1
                      spec:
                        shell: Bash
                        executionTarget: {}
                        source:
                          type: Inline
                          spec:
                            script: <+input>
                        environmentVariables: []
                        outputVariables: []
                      timeout: <+input>
            tags: {}
            failureStrategies:
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: ManualIntervention
                    spec:
                      timeout: 3m
                      onTimeout:
                        action:
                          type: MarkAsSuccess
        - stage:
            name: approval
            identifier: approval
            description: ""
            type: Custom
            spec:
              execution:
                steps:
                  - step:
                      type: Wait
                      name: Wait_1
                      identifier: Wait_1
                      spec:
                        duration: 12s
            tags: {}
    - stage:
        name: kubernetes
        identifier: kubernetes
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: sample_service_1678068340991
          environment:
            environmentRef: abcEnv
            gitBranch: master
            deployToAll: false
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: <+input>
                  spec:
                    skipDryRun: ""
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: sample
        identifier: sample
        tags: {}
        template:
          templateRef: account.stage_template_harshit_3sep
          versionLabel: "1"
          templateInputs:
            type: Deployment
            spec:
              environment:
                environmentRef: <+input>
                environmentInputs: <+input>
                serviceOverrideInputs: <+input>
                infrastructureDefinitions: <+input>
              service:
                serviceRef: <+input>
                serviceInputs: <+input>
              execution:
                steps:
                  - stepGroup:
                      identifier: test_step
                      template:
                        templateInputs:
                          variables:
                            - name: var1
                              type: String
                              value: <+input>
                            - name: var3
                              type: String
                              value: <+input>
                            - name: test
                              type: String
                              value: <+input>
            timeout: <+input>
            variables:
              - name: a
                type: String
                value: <+input>
  variables:
    - name: sapmple
      type: String
      description: ""
      required: false
      value: <+input>
